[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pinn-swe-reflections-lab"
version = "0.1.0"
description = "Experimental framework for PINNs on 1D shallow-water closed-boundary reflections."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "Maxim Milashchenko" }
]

dependencies = [
  "torch>=2.7.0",
  "numpy>=2.4.1",
  "scipy>=1.16.0",
  "matplotlib>=3.10.0",
  "pandas>=2.3.0",
  "smt>=2.10.0",
]

[project.optional-dependencies]
notebooks = [
  "jupyterlab>=4.4.0",
  "ipykernel>=6.30.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true